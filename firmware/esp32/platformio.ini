[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<diagnostics/>
lib_deps =
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit INA219
  milesburton/DallasTemperature
  paulstoffregen/OneWire
  madhephaestus/ESP32Servo
  adafruit/DHT sensor library
  marcoschwartz/LiquidCrystal_I2C

[env:diag_01_relays]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> +<diagnostics/01_relays_leds_check.cpp>
lib_deps = ${env:esp32dev.lib_deps}

[env:diag_02_i2c]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> +<diagnostics/02_i2c_bus_scan.cpp>
lib_deps = ${env:esp32dev.lib_deps}

[env:diag_03_digital]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> +<diagnostics/03_sensors_read_check.cpp>
lib_deps = ${env:esp32dev.lib_deps}

[env:diag_04_servo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> +<diagnostics/04_servo_motion_check.cpp>
lib_deps = ${env:esp32dev.lib_deps}

[env:diag_inference]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> +<diagnostics/inference_check.cpp>
lib_deps = ${env:esp32dev.lib_deps}

[env:native]
platform = native
build_flags = -std=gnu++11
test_build_src = yes
build_src_filter = +<domain/> -<main.cpp>
