[env:base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_resetmethod = no_reset
upload_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[env:esp32dev]
extends = env:base
build_src_filter = +<*> -<diagnostics/>
lib_deps =
  adafruit/Adafruit SHTC3 Library
  adafruit/Adafruit INA219
  milesburton/DallasTemperature
  paulstoffregen/OneWire
  madhephaestus/ESP32Servo
  adafruit/DHT sensor library
  marcoschwartz/LiquidCrystal_I2C
  adafruit/RTClib

[env:diag_00_blink]
extends = env:base
build_src_filter = -<*> +<diagnostics/00_blink_builtin.cpp>

[env:diag_01_relays]
extends = env:base
build_src_filter = +<*> -<diagnostics/> -<main.cpp> +<diagnostics/01_relays_leds_check.cpp>
lib_deps = ${env:esp32dev.lib_deps}

[env:diag_02_i2c]
extends = env:base
build_src_filter = +<*> -<diagnostics/> -<main.cpp> +<diagnostics/02_i2c_bus_scan.cpp>
lib_deps = ${env:esp32dev.lib_deps}

[env:diag_03_digital]
extends = env:base
build_src_filter = -<*> +<diagnostics/03_sensors_read_check.cpp>
lib_deps = ${env:esp32dev.lib_deps}

[env:diag_04_servo]
extends = env:base
build_src_filter = +<*> -<diagnostics/> -<main.cpp> +<diagnostics/04_servo_motion_check.cpp>
