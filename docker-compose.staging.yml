name: aqua-atmos-staging

services:
  mock-esp32:
    container_name: aqua-staging-mock-esp32
    image: ghcr.io/appolinairee/aqua-atmos-ai:staging
    command: ["python", "app/mock_esp32.py"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/data', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    container_name: aqua-staging-dashboard
    image: ghcr.io/appolinairee/aqua-atmos-ai:staging
    command: ["python", "app/main.py"]
    depends_on:
      mock-esp32:
        condition: service_healthy
    environment:
      ESP32_HOST: mock-esp32:8080
      PYTHONPATH: app
      APP_ENV: staging
      USE_AWS_SECRETS: "true"
      AWS_SECRET_NAME: "aqua_atmos_app_secrets"
      AWS_REGION: "eu-north-1"
      VIRTUAL_HOST: "aqua-atmos.adandeappolinaire.me"
      LETSENCRYPT_HOST: "aqua-atmos.adandeappolinaire.me"
      VIRTUAL_PORT: "5000"
    ports:
      - "5001:5000"
    volumes:
      - aqua-staging-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx-proxy:
    container_name: aqua-staging-nginx
    image: nginxproxy/nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: unless-stopped

  acme-companion:
    container_name: aqua-staging-acme
    image: nginxproxy/acme-companion
    depends_on:
      - nginx-proxy
    volumes_from:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DEFAULT_EMAIL=admin@adandeappolinaire.me
    restart: unless-stopped

volumes:
  aqua-staging-data:
  conf:
  vhost:
  html:
  certs:
  acme:
