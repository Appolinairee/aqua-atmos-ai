<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aqua Atmos - Demo</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&display=swap");

    :root {
      --bg: #f4f6f3;
      --ink: #111312;
      --muted: #69716d;
      --black: #070807;
      --blue: #009fe3;
      --blue-2: #006fb9;
      --green: #16a271;
      --red: #ef4444;
      --shadow: 0 20px 60px rgba(17, 19, 18, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Manrope, Inter, system-ui, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 18% 12%, #fff 0, #f4f6f3 34%, #e9eee9 100%);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }

    .app {
      min-height: 100vh;
      padding: 12px;
      display: grid;
      gap: 12px;
    }

    .shell {
      width: min(1480px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .topbar {
      min-height: 76px;
      padding: 8px 14px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(255, 255, 255, .92);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 86px minmax(360px, 1fr) auto;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 30;
    }

    .brand { display: flex; align-items: center; min-width: 0; }

    .mark {
      width: 78px;
      height: 66px;
      display: grid;
      place-items: center;
    }

    .mark img {
      width: 76px;
      height: 60px;
      object-fit: contain;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 6px;
      background: #eef2ef;
      border-radius: 999px;
      justify-self: center;
      align-items: center;
      white-space: nowrap;
    }

    .tab {
      border: 0;
      height: 42px;
      min-width: 106px;
      padding: 0 14px;
      border-radius: 999px;
      color: #4c5450;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      line-height: 1;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .tab.active {
      color: white;
      background: var(--black);
      box-shadow: 0 10px 28px rgba(7, 8, 7, .18);
    }

    .top-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .pill {
      height: 34px;
      padding: 0 11px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f3f5f3;
      color: #343936;
      font-size: 12px;
      font-weight: 750;
    }

    .pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .pill.ok { color: var(--green); }
    .pill.bad { color: var(--red); }

    .user-profile {
      height: 42px;
      padding: 4px 7px 4px 4px;
      border: 0;
      border-radius: 999px;
      background: #f3f5f3;
      color: #171a18;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 780;
      white-space: nowrap;
      line-height: 1;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background:
        url("https://i.pravatar.cc/96?img=47") center / cover,
        radial-gradient(circle at 35% 25%, #e9fbff 0 12%, #61c8f3 34%, #096fae 72%, #08213a 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.46);
    }

    .demo-grid {
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(360px, 1.08fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      border-radius: 32px;
      padding: 24px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.92);
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .panel-title {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .send-state {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      color: #32403a;
      background: #f3f5f3;
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .send-state.ok { color: var(--green); }
    .send-state.bad { color: var(--red); }

    .switch-row {
      min-height: 76px;
      padding: 16px;
      border-radius: 22px;
      background: #f3f5f3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .switch-row strong { display: block; font-size: 16px; }
    .switch-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 800; }

    .toggle {
      width: 62px;
      height: 36px;
      border: 0;
      border-radius: 999px;
      padding: 4px;
      background: #dfe5e1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .toggle::after {
      content: "";
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 8px 18px rgba(0,0,0,.16);
    }

    .toggle.active { justify-content: flex-end; background: var(--red); }

    .scenario-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .scenario {
      min-height: 112px;
      border: 0;
      border-radius: 22px;
      padding: 16px;
      background: #f3f5f3;
      text-align: left;
      display: grid;
      align-content: space-between;
      gap: 10px;
    }

    .scenario b { display: block; font-size: 15px; line-height: 1.2; }
    .scenario small { color: var(--muted); font-weight: 800; line-height: 1.35; }

    .scenario.active {
      color: white;
      background: linear-gradient(145deg, var(--black), #1f2723);
      box-shadow: 0 16px 36px rgba(7,8,7,.18);
    }

    .sliders { display: grid; gap: 14px; }

    .field {
      padding: 14px;
      border-radius: 22px;
      background: #f3f5f3;
    }

    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 900;
    }

    .field-head span:first-child { color: #424a46; }
    .value { color: var(--blue-2); font-variant-numeric: tabular-nums; }
    .value.warn { color: #a86708; }
    .value.danger { color: var(--red); }

    input[type="range"] { width: 100%; accent-color: var(--blue); }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .actions button {
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      color: white;
      background: var(--black);
      font-size: 13px;
      font-weight: 900;
    }

    .actions .light { color: #313936; background: #f3f5f3; }

    .mobile-nav {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      height: 56px;
      padding: 7px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(242,247,246,.88));
      box-shadow: 0 18px 44px rgba(17, 19, 18, .16), inset 0 0 0 1px rgba(17, 19, 18, .06);
      width: max-content;
      gap: 9px;
      z-index: 22;
      backdrop-filter: blur(14px);
    }

    .mobile-nav a {
      width: 42px;
      height: 42px;
      border-radius: 15px;
      color: #202623;
      display: grid;
      place-items: center;
      text-decoration: none;
      grid-auto-flow: column;
      gap: 8px;
      padding: 0;
    }

    .mobile-nav a svg { width: 21px; height: 21px; }
    .mobile-nav a span { display: none; font-size: 12.5px; font-weight: 850; line-height: 1; white-space: nowrap; }

    .mobile-nav a.active {
      width: auto;
      min-width: 106px;
      padding: 0 14px;
      border-radius: 16px;
      color: white;
      background: linear-gradient(145deg, var(--blue), var(--blue-2));
      box-shadow: 0 10px 24px rgba(0, 159, 227, .24);
    }

    .mobile-nav a.active span { display: inline; }

    @media (max-width: 1180px) and (min-width: 901px) {
      .app { padding: 8px; }
      .topbar {
        min-height: 64px;
        grid-template-columns: 76px minmax(360px, 1fr) auto;
        padding: 6px 12px;
        border-radius: 20px;
        gap: 10px;
      }
      .mark { width: 72px; height: 58px; }
      .mark img { width: 70px; height: 56px; }
      .tabs { display: none; }
      .profile-name { display: none; }
      .user-profile { height: 38px; padding: 3px 5px 3px 3px; }
      .avatar { width: 32px; height: 32px; }
      .mobile-nav { display: flex; }
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: 74px minmax(0, 1fr);
        border-radius: 24px;
        gap: 8px;
      }
      .tabs { display: none; }
      .top-actions { justify-self: end; }
      .profile-name { display: none; }
      .demo-grid { grid-template-columns: 1fr; }
      .mobile-nav { display: flex; }
    }

    @media (max-width: 560px) {
      .app { padding: 10px; }
      .topbar { padding: 14px; }
      .mark { width: 68px; height: 54px; }
      .mark img { width: 66px; height: 52px; }
      .scenario-grid { grid-template-columns: 1fr; }
      .mobile-nav { left: 14px; right: auto; transform: none; }
      .mobile-nav a:not(.active) { width: 38px; }
    }
  </style>
</head>
<body>
  <div class="app" data-view="demo">
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="mark"><img src="/assets/logo.png" alt="Aqua Atmos"></div>
        </div>

        <nav class="tabs" aria-label="Navigation principale">
          <a class="tab" href="/">Accueil</a>
          <a class="tab" href="/">Systeme</a>
          <a class="tab" href="/">Controle</a>
          <a class="tab" href="/">Historique</a>
          <a class="tab active" href="/simulation">Demo</a>
        </nav>

        <div class="top-actions">
          <span class="pill" id="statusPill">Simulation Off</span>
          <button class="user-profile" type="button" aria-label="Profil utilisateur">
            <span class="avatar"></span>
            <span class="profile-name">Meryem QUERCHI</span>
          </button>
        </div>
      </header>

      <main class="demo-grid">
        <section class="panel">
          <div class="panel-head">
            <p class="panel-title">Demo</p>
            <span class="send-state" id="sendState">Pret</span>
          </div>

          <div class="switch-row">
            <div>
              <strong>Injection active</strong>
              <span>Remplace les capteurs reels par les valeurs ci-dessous.</span>
            </div>
            <button class="toggle" id="simToggle" type="button" aria-label="Activer la simulation"></button>
          </div>

          <p class="panel-title">Scenarios rapides</p>
          <div class="scenario-grid" id="scenarioGrid"></div>

          <div class="actions">
            <button class="light" id="resetBtn" type="button">Valeurs normales</button>
            <button id="sendBtn" type="button">Injecter</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <p class="panel-title">Capteurs simules</p>
            <span class="send-state ok" id="activeScenario">Normal</span>
          </div>
          <div class="sliders" id="sliders"></div>
        </section>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Navigation mobile">
      <a href="/" aria-label="Accueil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.02 2.84 3.63 7.04C2.73 7.74 2 9.23 2 10.36v7.41c0 2.32 1.89 4.22 4.21 4.22h11.58c2.32 0 4.21-1.9 4.21-4.21V10.5c0-1.21-.81-2.76-1.8-3.45l-6.18-4.33c-1.4-.98-3.65-.93-5 .12Z"/><path d="M12 17.99v-3"/></svg></a>
      <a href="/" aria-label="Systeme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.6 7.2c.1.6 0 1.3-.1 2l-.7 4.7c-.6 3.9-2.4 5.2-6.3 4.6l-4.7-.7c-3.9-.6-5.2-2.4-4.6-6.3l.7-4.7c.6-3.9 2.4-5.2 6.3-4.6l4.7.7c3.1.5 4.6 1.8 4.7 4.3Z"/><circle cx="8.2" cy="7.2" r="1.7"/></svg></a>
      <a href="/" aria-label="Controle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></svg></a>
      <a class="active" href="/simulation" aria-label="Demo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3 4 14h7l-1 7 7-11h-7l0-7Z"/><path d="M17 4h3v3"/><path d="M20 4l-5 5"/></svg><span>Demo</span></a>
    </nav>
  </div>

  <script>
    const simToggle = document.getElementById("simToggle");
    const statusPill = document.getElementById("statusPill");
    const sendState = document.getElementById("sendState");
    const activeScenario = document.getElementById("activeScenario");
    let simulationActive = false;
    let currentScenario = "normal";
    let sendTimer = null;

    const fields = [
      { key: "temp", label: "Temperature air", unit: " C", min: 5, max: 45, step: 0.5, value: 25 },
      { key: "hum", label: "Humidite relative", unit: " %", min: 10, max: 95, step: 1, value: 60 },
      { key: "bat", label: "Batterie SOC", unit: " %", min: 5, max: 100, step: 1, value: 80 },
      { key: "res", label: "Reservoir", unit: " %", min: 0, max: 100, step: 1, value: 30 },
      { key: "cond", label: "Temperature condenseur", unit: " C", min: 5, max: 75, step: 0.5, value: 25 },
      { key: "delta_hr", label: "Delta HR sorbant", unit: " %", min: 0, max: 15, step: 0.1, value: 5 },
      { key: "sol", label: "Rayonnement solaire", unit: " W/m2", min: 0, max: 1000, step: 50, value: 0 }
    ];

    const scenarios = {
      production: {
        name: "Production eau",
        desc: "Air humide, production visible",
        values: { temp: 26, hum: 78, bat: 86, res: 24, cond: 22, delta_hr: 5, sol: 80 }
      },
      vcrc_only: {
        name: "VCRC seul",
        desc: "Production mecanique prioritaire",
        values: { temp: 28, hum: 72, bat: 90, res: 25, cond: 22, delta_hr: 8, sol: 0 },
        overrides: { vcrc: true, sorb: "VEILLE", heater: false }
      },
      sorbent_only: {
        name: "Sorbant seul",
        desc: "Absorption sans VCRC",
        values: { temp: 16, hum: 45, bat: 90, res: 25, cond: 18, delta_hr: 5, sol: 0 }
      },
      regeneration: {
        name: "Regeneration",
        desc: "Chauffage force par regeneration",
        values: { temp: 32, hum: 35, bat: 92, res: 35, cond: 30, delta_hr: 0.5, sol: 650 }
      },
      anti_frost: {
        name: "Anti-givre",
        desc: "Point de rosee trop bas, VCRC coupe",
        values: { temp: 3, hum: 70, bat: 90, res: 20, cond: 5, delta_hr: 5, sol: 0 }
      },
      dry_air: {
        name: "Air trop sec",
        desc: "Air insuffisant pour produire",
        values: { temp: 30, hum: 25, bat: 90, res: 20, cond: 24, delta_hr: 8, sol: 300 }
      },
      condenser: {
        name: "Condenseur chaud",
        desc: "Securite locale: VCRC coupe uniquement",
        values: { temp: 34, hum: 66, bat: 84, res: 30, cond: 66, delta_hr: 4, sol: 500 }
      },
      reservoir: {
        name: "Reservoir plein",
        desc: "Securite: coupure totale attendue",
        values: { temp: 25, hum: 70, bat: 82, res: 98, cond: 24, delta_hr: 5, sol: 0 }
      },
      normal: {
        name: "Normal",
        desc: "Air stable, energie OK, reservoir disponible",
        values: { temp: 25, hum: 60, bat: 80, res: 30, cond: 25, delta_hr: 5, sol: 0 }
      }
    };

    function fieldValue(key) {
      return Number(document.getElementById(`field-${key}`).value);
    }

    function setFieldValue(key, value) {
      const input = document.getElementById(`field-${key}`);
      if (input) input.value = value;
    }

    function valueClass(key, value) {
      if ((key === "bat" && value < 20) || (key === "res" && value >= 95) || (key === "cond" && value >= 60)) return "danger";
      if ((key === "bat" && value < 40) || (key === "res" && value >= 80) || (key === "delta_hr" && value <= 1)) return "warn";
      return "";
    }

    function renderSliders() {
      document.getElementById("sliders").innerHTML = fields.map((field) => `
        <label class="field">
          <div class="field-head">
            <span>${field.label}</span>
            <span class="value" id="value-${field.key}">${field.value}${field.unit}</span>
          </div>
          <input id="field-${field.key}" type="range" min="${field.min}" max="${field.max}" step="${field.step}" value="${field.value}">
        </label>
      `).join("");

      fields.forEach((field) => {
        document.getElementById(`field-${field.key}`).addEventListener("input", () => {
          currentScenario = "manual";
          updateLabels();
          queueSend();
        });
      });
      updateLabels();
    }

    function renderScenarios() {
      document.getElementById("scenarioGrid").innerHTML = Object.entries(scenarios).map(([key, scenario]) => `
        <button class="scenario" type="button" data-scenario="${key}">
          <b>${scenario.name}</b>
          <small>${scenario.desc}</small>
        </button>
      `).join("");
      document.querySelectorAll("[data-scenario]").forEach((button) => {
        button.addEventListener("click", () => loadScenario(button.dataset.scenario));
      });
    }

    function updateLabels() {
      fields.forEach((field) => {
        const value = fieldValue(field.key);
        const node = document.getElementById(`value-${field.key}`);
        node.textContent = `${value}${field.unit}`;
        node.className = `value ${valueClass(field.key, value)}`.trim();
      });
      document.querySelectorAll("[data-scenario]").forEach((button) => {
        button.classList.toggle("active", button.dataset.scenario === currentScenario);
      });
      activeScenario.textContent = currentScenario === "manual" ? "Manuel" : scenarios[currentScenario]?.name || "Normal";
    }

    function loadScenario(key) {
      const scenario = scenarios[key];
      if (!scenario) return;
      currentScenario = key;
      Object.entries(scenario.values).forEach(([field, value]) => setFieldValue(field, value));
      simulationActive = true;
      updateSimulationState();
      updateLabels();
      sendSimulationData();
    }

    function payload() {
      const overrides = scenarios[currentScenario]?.overrides || {};
      return {
        active: simulationActive,
        temp: fieldValue("temp"),
        hum: fieldValue("hum"),
        bat: fieldValue("bat"),
        res: fieldValue("res"),
        cond: fieldValue("cond"),
        delta_hr: fieldValue("delta_hr"),
        sol: fieldValue("sol"),
        ...overrides
      };
    }

    function updateSimulationState() {
      simToggle.classList.toggle("active", simulationActive);
      statusPill.classList.toggle("ok", simulationActive);
      statusPill.classList.toggle("bad", !simulationActive);
      statusPill.textContent = simulationActive ? "Simulation On" : "Simulation Off";
    }

    function setSendState(text, status = "") {
      sendState.textContent = text;
      sendState.className = `send-state ${status}`.trim();
    }

    function queueSend() {
      clearTimeout(sendTimer);
      sendTimer = setTimeout(sendSimulationData, 250);
    }

    async function sendSimulationData() {
      setSendState("Envoi...");
      try {
        const response = await fetch("/api/inject_sensors", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload())
        });
        if (!response.ok) throw new Error("Injection refusee");
        setSendState("Injecte", "ok");
      } catch (err) {
        console.error("Erreur de simulation", err);
        setSendState("Erreur", "bad");
      }
    }

    simToggle.addEventListener("click", () => {
      simulationActive = !simulationActive;
      updateSimulationState();
      sendSimulationData();
    });

    document.getElementById("sendBtn").addEventListener("click", sendSimulationData);
    document.getElementById("resetBtn").addEventListener("click", () => loadScenario("normal"));

    renderScenarios();
    renderSliders();
    updateSimulationState();
  </script>
</body>
</html>
